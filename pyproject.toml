[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fatture-cli"
version = "0.1.0"
description = "CLI for Fatture in Cloud API — built for AI agents and developers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MayAI", email = "info@mayai.it" }]
keywords = ["fatture-in-cloud", "cli", "invoicing", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
]

[project.scripts]
fatture = "fatture_cli.main:cli"

[project.urls]
Homepage = "https://mayai.it"
Repository = "https://github.com/mayai-it/fatture-cli"
Documentation = "https://developers.fattureincloud.it/"

[tool.hatch.build.targets.wheel]
packages = ["fatture_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
