[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mayai-fatture-cli"
version = "0.1.0"
description = "Fatture in Cloud CLI — built for AI agents and developers. Manage invoices, clients, and products from the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MayAI", email = "info@mayai.it" }]
maintainers = [{ name = "MayAI", email = "info@mayai.it" }]
keywords = [
    "fatture-in-cloud",
    "fatture",
    "invoicing",
    "italian-invoicing",
    "cli",
    "ai-agents",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Italian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "mcp>=1.2.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.5.0",
]

[project.scripts]
fatture = "fatture_cli.main:cli"
fatture-mcp = "fatture_cli.mcp_server:main"

[project.urls]
Homepage = "https://mayai.it"
Repository = "https://github.com/mayai-it/fatture-cli"
Issues = "https://github.com/mayai-it/fatture-cli/issues"
Documentation = "https://developers.fattureincloud.it/"

[tool.hatch.build.targets.wheel]
packages = ["fatture_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
